<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Executive BI Dashboard</title>
<style>
  :root{
    --bg:#121212; --card:#1E1E1E; --border:#2C2C2E;
    --primary:#00E5FF; --success:#32D74B; --danger:#FF453A; --warning:#FFD60A;
    --text:#FFFFFF; --muted:#98989D; --hover:#252525; --alertbg:#3A1C1C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;}
  main{max-width:1280px;margin:0 auto;padding:24px;}
  h1{font-size:24px;font-weight:600;margin:0 0 4px;}
  h2{font-size:18px;font-weight:600;margin:0 0 12px;}
  .sub{color:var(--muted);margin:0 0 24px;}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-bottom:24px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;}
  .span3{grid-column:span 3;} .span4{grid-column:span 4;}
  .span6{grid-column:span 6;} .span8{grid-column:span 8;} .span12{grid-column:span 12;}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:24px;}
  .kpi-label{color:var(--muted);font-size:13px;margin-bottom:8px;}
  .kpi-value{font-family:"JetBrains Mono","Fira Code",ui-monospace,monospace;font-size:32px;font-weight:700;}
  .kpi-delta{font-size:13px;margin-top:6px;}
  .kpi-note{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.5;}
  .normal{color:var(--success);} .watch{color:var(--primary);} .risk{color:var(--danger);}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;margin-left:6px;
    background:var(--warning);color:#000;font-weight:600;}
  .chart-title{font-size:15px;font-weight:600;margin-bottom:4px;}
  .chart-note{color:var(--muted);font-size:12px;margin-bottom:12px;}
  svg{width:100%;height:auto;}
  .alert{background:var(--alertbg);color:var(--danger);border-left:4px solid var(--danger);
    border-radius:8px;padding:14px 16px;margin-bottom:24px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:500;padding:10px;border-bottom:1px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);}
  tr:hover td{background:var(--hover);}
  .insight p{line-height:1.7;margin:0 0 10px;}
  .insight b{color:var(--primary);}
  .action{border-left:3px solid var(--border);padding-left:14px;margin-bottom:16px;}
  .action .pr-high{color:var(--danger);} .action .pr-med{color:var(--warning);} .action .pr-low{color:var(--success);}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:24px 0;}
  @media(max-width:900px){
    .grid,.summary{grid-template-columns:1fr;}
    .span3,.span4,.span6,.span8,.span12{grid-column:span 1;}
    main{padding:16px;}
    table{display:block;overflow-x:auto;white-space:nowrap;}
  }
  .page-break{height:0;border-top:1px dashed var(--border);margin:8px 0 0;break-before:page;}
  .appendix{max-width:1280px;margin:0 auto;padding:24px;}
  .appendix-tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;
    color:var(--primary);border:1px solid var(--primary);border-radius:8px;padding:3px 10px;margin-bottom:12px;}
  .appendix-title{font-size:20px;font-weight:600;margin:0 0 6px;}
  .appendix-desc{color:var(--muted);font-size:13px;margin:0 0 16px;}
  @media print{.appendix{break-before:page;}}
</style>
</head>
<body>
<main>
  <!-- HEADER -->
  <header><h1 id="title">Executive BI Dashboard</h1><p class="sub" id="subtitle"></p></header>

  <!-- DATA QUALITY ALERT (show only if any gate fails) -->
  <div class="alert" id="qualityAlert" style="display:none;"></div>

  <!-- EXECUTIVE SUMMARY (3 cards) -->
  <section class="summary" id="summary"></section>

  <!-- KPI CARDS (4-8) -->
  <section class="grid" id="kpis"></section>

  <!-- MAIN + SECONDARY CHARTS -->
  <section class="grid">
    <div class="card span8"><div class="chart-title" id="mainTitle"></div>
      <div class="chart-note" id="mainNote"></div><div id="mainChart"></div></div>
    <div class="card span4"><div class="chart-title" id="sideTitle"></div>
      <div class="chart-note" id="sideNote"></div><div id="sideChart"></div></div>
  </section>

  <!-- DECISION / RISK TABLE -->
  <section class="card span12" style="margin-bottom:24px;">
    <h2>의사결정 테이블</h2>
    <table><thead><tr>
      <th>Priority</th><th>Area</th><th>Issue</th><th>Signal</th><th>Impact</th><th>Recommendation</th><th>Owner</th>
    </tr></thead><tbody id="riskBody"></tbody></table>
  </section>

  <!-- AI INSIGHT -->
  <section class="card span12 insight" style="margin-bottom:24px;">
    <h2>AI 인사이트 리포트</h2><div id="insight"></div>
  </section>

  <!-- EXECUTIVE ACTION ITEMS -->
  <section class="card span12" style="margin-bottom:24px;">
    <h2>임원 실행 과제</h2><div id="actions"></div>
  </section>

  <footer id="footer"></footer>
</main>

<!-- APPENDIX: KPI 산출식 (independent annex on the last page) -->
<div class="page-break"></div>
<section class="appendix">
  <div class="appendix-tag">별첨 (Appendix)</div>
  <h2 class="appendix-title">KPI 산출식 및 계산 과정</h2>
  <p class="appendix-desc">본 별첨은 대시보드 본문의 각 KPI가 어떤 산식과 입력값으로 산출되었는지 보여준다. 결과 열의 값은 본문 KPI 카드 값과 일치한다.</p>
  <table><thead><tr>
    <th>KPI</th><th>산식</th><th>입력값</th><th>결과</th>
  </tr></thead><tbody id="kpiCalcBody"></tbody></table>
</section>

<script>
/* ===== FILL ONLY THIS DATA OBJECT (GPT writes computed values + sentences) ===== */
const DATA = {
  title:"", subtitle:"",
  qualityAlert:"",                       // "" hides the alert
  summary:[ /* {text:""} x3 */ ],
  kpis:[ /* {label,value,delta,status:"normal|watch|risk",badge:false,note} */ ],
  mainChart:{ type:"line", title:"", note:"", data:[ /* {label,value} */ ] },
  sideChart:{ type:"donut", title:"", note:"", data:[ /* {label,value} */ ] },
  risks:[ /* {priority,area,issue,signal,impact,reco,owner} */ ],
  insight:[ /* "<b>..</b> .." paragraphs, 10 items */ ],
  actions:[ /* {issue,impact,reco,priority:"High|Medium|Low"} */ ],
  kpiCalc:[ /* {kpi, formula, inputs, result} — result must equal the KPI card value */ ],
  footer:""
};

/* ===== REUSABLE HELPERS (do not modify) ===== */
const C={primary:"#00E5FF",success:"#32D74B",danger:"#FF453A",warning:"#FFD60A",muted:"#98989D",border:"#2C2C2E"};
const sNum=(v,f=0)=>Number.isFinite(Number(v))?Number(v):f;
const sMax=a=>Math.max(...a.map(x=>sNum(x)),1);
const trunc=(s,n=10)=>s&&s.length>n?s.slice(0,n)+"…":s;
const fmt=v=>sNum(v).toLocaleString();

function lineArea(arr){const W=720,H=300,P=40,max=sMax(arr.map(d=>d.value));
  const pts=arr.map((d,i)=>[P+i*((W-2*P)/Math.max(arr.length-1,1)),H-P-(sNum(d.value)/max)*(H-2*P)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  const area=path+` L${pts[pts.length-1][0]} ${H-P} L${pts[0][0]} ${H-P} Z`;
  const lbls=arr.map((d,i)=>`<text x="${pts[i][0]}" y="${H-P+16}" fill="${C.muted}" font-size="10" text-anchor="middle">${trunc(d.label,6)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="${C.border}"/>
    <path d="${area}" fill="${C.primary}" opacity="0.12"/><path d="${path}" fill="none" stroke="${C.primary}" stroke-width="2.5"/>${lbls}</svg>`;}

function verticalBars(arr){const W=720,H=300,P=40,max=sMax(arr.map(d=>d.value)),bw=(W-2*P)/arr.length*0.6;
  const bars=arr.map((d,i)=>{const h=(sNum(d.value)/max)*(H-2*P),x=P+i*((W-2*P)/arr.length)+ ((W-2*P)/arr.length-bw)/2,y=H-P-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${C.primary}"/>
      <text x="${x+bw/2}" y="${y-6}" fill="${C.muted}" font-size="10" text-anchor="middle">${fmt(d.value)}</text>
      <text x="${x+bw/2}" y="${H-P+16}" fill="${C.muted}" font-size="10" text-anchor="middle">${trunc(d.label,7)}</text>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="${C.border}"/>${bars}</svg>`;}

function pareto(arr){const W=720,H=300,P=40;const s=[...arr].sort((a,b)=>b.value-a.value);
  const tot=s.reduce((a,b)=>a+sNum(b.value),0)||1,max=sMax(s.map(d=>d.value));let cum=0;
  const bw=(W-2*P)/s.length*0.6;let bars="",line="";const pts=[];
  s.forEach((d,i)=>{const h=(sNum(d.value)/max)*(H-2*P),x=P+i*((W-2*P)/s.length)+((W-2*P)/s.length-bw)/2,y=H-P-h;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${C.primary}"/>
      <text x="${x+bw/2}" y="${H-P+16}" fill="${C.muted}" font-size="10" text-anchor="middle">${trunc(d.label,7)}</text>`;
    cum+=sNum(d.value);pts.push([x+bw/2,H-P-(cum/tot)*(H-2*P)]);});
  line=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  const y80=H-P-0.8*(H-2*P);
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="${C.border}"/>
    <line x1="${P}" y1="${y80}" x2="${W-P}" y2="${y80}" stroke="${C.warning}" stroke-dasharray="4" opacity="0.6"/>
    ${bars}<path d="${line}" fill="none" stroke="${C.warning}" stroke-width="2"/></svg>`;}

function donut(arr){const tot=arr.reduce((a,b)=>a+sNum(b.value),0)||1,cx=150,cy=150,r=100;let a0=-Math.PI/2;
  const cols=[C.primary,C.success,C.warning,C.danger,C.muted];
  const segs=arr.map((d,i)=>{const a1=a0+(sNum(d.value)/tot)*2*Math.PI;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const large=(a1-a0)>Math.PI?1:0;const p=`M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} Z`;a0=a1;
    return `<path d="${p}" fill="${cols[i%cols.length]}"/>`;}).join("");
  const leg=arr.map((d,i)=>`<g transform="translate(310,${40+i*24})"><rect width="12" height="12" fill="${cols[i%cols.length]}" rx="2"/>
    <text x="18" y="11" fill="${C.muted}" font-size="12">${trunc(d.label,12)} (${fmt(d.value)})</text></g>`).join("");
  return `<svg viewBox="0 0 520 300">${segs}<circle cx="${cx}" cy="${cy}" r="55" fill="#1E1E1E"/>${leg}</svg>`;}

function barMarker(arr){const W=720,H=300,P=40,max=sMax(arr.map(d=>d.value)),mmax=sMax(arr.map(d=>d.marker||0));
  const bw=(W-2*P)/arr.length*0.5;const items=arr.map((d,i)=>{const h=(sNum(d.value)/max)*(H-2*P);
    const x=P+i*((W-2*P)/arr.length)+((W-2*P)/arr.length-bw)/2,y=H-P-h;
    const my=H-P-(sNum(d.marker)/mmax)*(H-2*P);
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${C.primary}"/>
      <circle cx="${x+bw/2}" cy="${my}" r="5" fill="${C.warning}"/>
      <text x="${x+bw/2}" y="${H-P+16}" fill="${C.muted}" font-size="10" text-anchor="middle">${trunc(d.label,7)}</text>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="${C.border}"/>${items}</svg>`;}

const RENDER={line:lineArea,area:lineArea,bar:verticalBars,pareto:pareto,donut:donut,barmarker:barMarker};
function chart(spec){const fn=RENDER[(spec.type||"bar").toLowerCase()]||verticalBars;return fn(spec.data||[]);}

/* ===== BOOTSTRAP (do not modify) ===== */
function init(){
  document.getElementById("title").textContent=DATA.title||"Executive BI Dashboard";
  document.getElementById("subtitle").textContent=DATA.subtitle||"";
  if(DATA.qualityAlert){const a=document.getElementById("qualityAlert");a.style.display="block";a.textContent=DATA.qualityAlert;}
  document.getElementById("summary").innerHTML=(DATA.summary||[]).map(s=>`<div class="card"><p>${s.text}</p></div>`).join("");
  document.getElementById("kpis").innerHTML=(DATA.kpis||[]).map(k=>`<div class="card span3">
    <div class="kpi-label">${k.label}${k.badge?'<span class="badge">검증필요</span>':''}</div>
    <div class="kpi-value ${k.status||'normal'}">${k.value}</div>
    <div class="kpi-delta ${k.status||'normal'}">${k.delta||''}</div>
    <div class="kpi-note">${k.note||''}</div></div>`).join("");
  document.getElementById("mainTitle").textContent=DATA.mainChart.title||"";
  document.getElementById("mainNote").textContent=DATA.mainChart.note||"";
  document.getElementById("mainChart").innerHTML=chart(DATA.mainChart);
  document.getElementById("sideTitle").textContent=DATA.sideChart.title||"";
  document.getElementById("sideNote").textContent=DATA.sideChart.note||"";
  document.getElementById("sideChart").innerHTML=chart(DATA.sideChart);
  document.getElementById("riskBody").innerHTML=(DATA.risks||[]).map(r=>`<tr>
    <td class="${r.priority==='High'?'risk':r.priority==='Medium'?'watch':'normal'}">${r.priority}</td>
    <td>${r.area}</td><td>${r.issue}</td><td>${r.signal||''}</td><td>${r.impact}</td><td>${r.reco}</td><td>${r.owner||''}</td></tr>`).join("");
  document.getElementById("insight").innerHTML=(DATA.insight||[]).map(p=>`<p>${p}</p>`).join("");
  document.getElementById("actions").innerHTML=(DATA.actions||[]).map(a=>{const c=a.priority==='High'?'pr-high':a.priority==='Medium'?'pr-med':'pr-low';
    return `<div class="action"><p><b>[Issue]</b> ${a.issue}</p><p><b>[Impact]</b> ${a.impact}</p>
      <p><b>[Recommendation]</b> ${a.reco}</p><p><b>[Priority]</b> <span class="${c}">${a.priority}</span></p></div>`;}).join("");
  document.getElementById("kpiCalcBody").innerHTML=(DATA.kpiCalc||[]).map(r=>`<tr><td>${r.kpi}</td><td>${r.formula}</td><td>${r.inputs}</td><td>${r.result}</td></tr>`).join("");
  document.getElementById("footer").textContent=DATA.footer||"";
}
init();
</script>
</body>
</html>
